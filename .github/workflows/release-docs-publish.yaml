# Shared documentation build-and-deploy logic used by both release-docs.yaml (stable
# releases, triggered by version tags) and release-docs-dev.yaml (dev docs, triggered
# on push to main). Keeping the steps in one place avoids the two drifting.

name: Documentation Publish
on:
  workflow_call:
    inputs:
      mode:
        description: "Which publish target: 'stable' or 'dev'"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@v0.2.0
        with:
          install-args: "--docs-deps"

      # Configure git and fetch gh-pages branch for mike
      - name: Setup doc deploy
        env:
          CI_BOT_EMAIL: ${{ secrets.CI_BOT_EMAIL }}
        run: |
          git config --global user.name ci-docs-bot
          git config --global user.email "$CI_BOT_EMAIL"
          git fetch origin gh-pages --depth=1 --tags

      # Build and deploy documentation for the requested mode
      - name: Build and deploy documentation
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            stable) inv doc.publish-latest ;;
            dev) inv doc.publish-dev ;;
            *)
              echo "::error::Unknown mode '$MODE', expected 'stable' or 'dev'"
              exit 1
              ;;
          esac
