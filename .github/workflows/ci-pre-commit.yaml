# Pre-commit hooks validation workflow.
# Runs all configured pre-commit hooks to validate code quality.
# Checks formatting, linting, and other code quality rules.

name: Pre-commit
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Run pre-commit hooks to validate code quality
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@a592cf6a2b2788f2e5846e4e29151f8895e1c643 # ratchet:durandtibo/setup-venv-uv-action@v0.3.0
        with:
          python-version: "3.14"

      - name: Run pre-commit hooks on all files
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files
