# Discovered compatibility update workflow.
# Regenerates the automatically discovered package/Python-version
# compatibility data (feu/compat/data/*.json) weekly.
# Creates a pull request with the updated constraints after validation.

name: Update Discovered Compatibility

on:
  schedule:
    - cron: "0 6 * * 5" # Run every Friday at 6:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  update-discovered-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout only needs read; the app token grants write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@4445098aa662d3d72aa0455918bc46a091b2a7f8 # ratchet:durandtibo/setup-venv-uv-action@v0.3.1

      # Regenerate the package/Python-version compatibility data (one JSON file per package)
      - name: Discover package compatibility
        run: |
          python dev/generate_compat_data.py

      # Validate the regenerated data with pre-commit
      - name: Run pre-commit
        run: |
          pre-commit run --all-files || pre-commit run --all-files

      # Create a pull request with the updated constraints
      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # ratchet:peter-evans/create-pull-request@v8
        if: always()
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/discovered-compat
          title: Update discovered compatibility constraints
          commit-message: "Update discovered compatibility constraints"
          body: Update automatically discovered package/Python-version compatibility constraints.
          author: ci-bot <${{ secrets.CI_BOT_EMAIL }}>
