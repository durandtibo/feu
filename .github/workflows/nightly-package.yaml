name: Nightly Package Tests
on:
  schedule:
    - cron: "40 8 * * *" # run at 8:40 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Get the package names and their version bounds from
  # dev/config/package_versions.json. Package names are used instead of
  # pyproject.toml's extras names, since feu's extras don't map 1:1 to
  # package names (e.g. the "requests" extra installs both "requests" and
  # "urllib3", "cli" installs "click", "git" installs "gitpython").
  get-versions:
    uses: ./.github/workflows/lib-get-package-versions.yaml
  # Load the shared python-version/OS matrix once, and pass it down to every
  # job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install feu"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install "feu[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-extras:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre feu"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install --pre "feu[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-extras:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      install-args: "--pre"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  ########################
  #     Dependencies     #
  ########################

  # One job per dependency (required and optional alike), driven by
  # get-versions instead of a hardcoded list, so a new dependency only needs
  # to be added to dev/config/package_versions.json (kept up to date by
  # bot-generate-package-versions.yaml).
  test-dep:
    needs: [get-versions, get-matrix]
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-versions.outputs.package_names) }}
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions)[matrix.package-name]) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
