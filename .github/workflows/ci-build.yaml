# Build and package validation workflow.
# Tests that the package can be built correctly as both source distribution and wheel.
# Validates package metadata, dependencies, and that the package is properly typed.

name: Build Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Load the extras from pyproject.toml's [project.optional-dependencies],
  # plus "" for a baseline "no extra" build.
  get-extras:
    uses: ./.github/workflows/lib-get-package-extras.yaml
    with:
      extra-values: '[""]'

  build:
    needs: get-extras
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        package-extra: ${{ fromJson(needs.get-extras.outputs.extras) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: feu
          package-extra: ${{ matrix.package-extra }}
          package-dependencies: "packaging"
          dist-type: ${{ matrix.dist-type }}

      - name: Run package checks
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Running package checks..."
          python tests/package_checks.py
          echo "✅ Package checks passed"

  build-all:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        # Test at least one full-extras build per supported Python version to
        # catch version-specific build regressions (e.g. free-threaded 3.13t/3.14t).
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: feu
          package-extra: all
          package-dependencies: "packaging"
          dist-type: ${{ matrix.dist-type }}
          verify-sdist-extra: false

      - name: Run package checks
        run: |
          set -euo pipefail
          echo "🔍 Running package checks..."
          python tests/package_checks.py
          echo "✅ Package checks passed"
