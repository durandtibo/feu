# Cyclic imports check.
# Imports every feu subpackage in isolation to catch circular-import
# regressions that only surface once a submodule is imported directly.

name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@a592cf6a2b2788f2e5846e4e29151f8895e1c643 # ratchet:durandtibo/setup-venv-uv-action@v0.3.0

      - name: check modules
        run: |
          inv imports.check-cycles
