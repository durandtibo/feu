# Code formatting and linting workflow.
# Checks code formatting and code quality with ruff.
# Ensures code follows project style guidelines.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up python environment
        uses: durandtibo/setup-venv-uv-action@v0.2.0

      - name: Check python formatting
        run: |
          inv format.check-python

      - name: Lint python scripts
        run: |
          inv lint.check-python

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell formatting
        run: |
          echo "🔍 Running ShellCheck..."
          shellcheck -- **/*.sh || exit 1

      - name: Install shfmt
        run: sudo snap install shfmt

      - name: Lint shell scripts
        run: |
          echo "✨ Checking formatting using shfmt..."
          shfmt -d -- **/*.sh
