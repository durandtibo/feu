name: PyPI Package Extras Install Test
on:
  workflow_call:
    inputs:
      install-args:
        default: ""
        description: "Optional arguments to install the package"
        required: false
        type: string
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Load the extras from pyproject.toml's [project.optional-dependencies],
  # plus "all" to also test installing every extra at once.
  get-extras:
    uses: ./.github/workflows/lib-get-package-extras.yaml
    with:
      extra-values: '["all"]'

  test:
    needs: get-extras
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
        extra: ${{ fromJson(needs.get-extras.outputs.extras) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install package
        run: |
          uv pip install ${{ inputs.install-args }} "feu[${{ matrix.extra }}]"
      # Display dependency tree
      - name: Show dependency tree
        run: |
          uv pip tree --show-version-specifiers
      # Run basic package checks
      - name: Run some checks
        run: |
          python tests/package_checks.py
