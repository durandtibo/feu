name: PyPI Package Extras Install Test
on:
  workflow_call:
    inputs:
      install-args:
        default: ""
        description: "Optional arguments to install the package"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          ["3.14", "3.14t", "3.13", "3.13t", "3.12", "3.11", "3.10"]
        extra: ["cli", "git", "requests"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install package
        run: |
          uv pip install ${{ inputs.install-args }} "feu[${{ matrix.extra }}]"
      # Display dependency tree
      - name: Show dependency tree
        run: |
          uv pip tree --show-version-specifiers
      # Run basic package checks
      - name: Run some checks
        run: |
          python tests/package_checks.py
