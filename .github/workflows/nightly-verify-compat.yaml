# Compatibility verification workflow.
# Installs every compatible package version combination (per Python version
# and OS) recorded in feu's compatibility data, to catch drift between the
# recorded constraints and what actually installs.

name: Verify Compatibility
on:
  schedule:
    - cron: "0 6 * * 3" # run every Wednesday at 6:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  all:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-15-intel]
        python-version:
          ["3.14", "3.14t", "3.13", "3.13t", "3.12", "3.11", "3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup python environment

        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install all compatible package versions

        run: |
          python dev/install_all_versions.py --installer uv
